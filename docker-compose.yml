services:

    backend:
        build:
          context: ./backend

        container_name: lucidsight-backend
        ports:
          - "5000:5000"

        env_file:
          - ./.env

        restart: unless-stopped



    frontend:
        build:
          context: .

        container_name: lucidsight-frontend
        ports:
          - "8000:80"

        depends_on:
          - backend

        restart: unless-stopped

